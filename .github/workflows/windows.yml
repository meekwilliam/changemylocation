name: Windows build

# changemylocation.exe for windows, the tauri app in windows/ on the same rust engine in core/ as the mac app
# no python and no gpl code, the iphone driver still comes from apple devices

on:
  push:
    branches: [main]
    paths: ["windows/**", "core/**", ".github/workflows/windows.yml"]
  workflow_dispatch:
  workflow_call:  # from release.yml

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Update Rust
        run: rustup update stable && rustup default stable

      - name: Build changemylocation.exe
        run: cargo build --release

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      # every compiled-in package's license, plus leaflet for the map, which ships inside the exe's page
      - name: Collect third-party licenses
        run: |
          cargo about generate about.hbs -o target/release/THIRD_PARTY_LICENSES.txt
          { echo; echo "================================================================================"; \
            echo "Leaflet (BSD-2-Clause), the map in the app window"; \
            echo "--------------------------------------------------------------------------------"; \
            cat web/vendor/leaflet/LICENSE; } >> target/release/THIRD_PARTY_LICENSES.txt

      - uses: actions/upload-artifact@v7
        with:
          name: changemylocation-windows
          path: |
            windows/target/release/changemylocation.exe
            windows/target/release/THIRD_PARTY_LICENSES.txt
